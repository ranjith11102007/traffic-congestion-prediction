# Alembic configuration for the Traffic Congestion Prediction API.
#
# The database URL is NOT set here. It is read from the application settings at
# runtime by migrations/env.py, so credentials live in the untracked .env file and
# never in a committed config. The `sqlalchemy.url` key below is present and
# deliberately empty; see the [alembic] section.
#
# Override per invocation if needed, e.g.
#   alembic -x db_url=postgresql+psycopg2://... upgrade head
# though the settings-based path is the supported route.

[alembic]
script_location = migrations
prepend_sys_path = .
# Intentionally empty. migrations/env.py resolves the DSN from application
# settings at runtime, so no credential can be committed here.
sqlalchemy.url =
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

# Timestamped, sortable revision identifiers. The hash keeps revisions short while
# staying unique, and revision files are timestamp-prefixed so `ls migrations/`
# reads chronologically.
revision_environment = false

# Use a timestamp plus hash rather than a bare hash: file names then sort by
# creation order, which matters once there is more than one migration.

[post_write_hooks]
# No auto-formatting hooks: the project's formatting is handled by the tooling in
# the developer setup, and a hook that silently rewrites migrations makes review
# harder.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S