name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate simulated data fixture
        # ml/data/raw, sample and processed are gitignored, but the Stage 3
        # training tests run on the generated fixture. Produce it exactly as the
        # development setup does: generate -> preprocess -> traffic_processed.csv.
        run: |
          python -m ml.data.sample.generate_simulated_dataset
          python -m ml.preprocessing --write-summary

      - name: Run test suite
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f backend/Dockerfile -t traffic-prediction-api:ci .